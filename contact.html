<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Fumo Shop</title>
    <link rel="stylesheet" href="style.css">
</head><body><header class="contact-header">
    <nav class="navbar section-content">
        <a href="index.html" class="nav-logo">
            <h2 class="logo-text">Fumo Shop</h2>
        </a>

        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="shop.html" class="nav-link">Shop</a></li>
            <li><a href="contact.html" class="nav-link active">Contact</a></li>
            <li><a href="sources.html" class="nav-link">Sources</a></li>
        </ul>
    </nav>
</header>

<main class="contact-page">

    <section class="contact-section">

        <h1 class="page-title">Contact Us!</h1>

        <form class="contact-form" action="#" method="post">

            <div class="form-group">
                <label for="name">Your Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="What is your message about?"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message here..."
                    required
                ></textarea>
            </div>

            <button type="submit" class="send-button">
                Send Message <span>→</span>
            </button>

        </form>

    </section>

</main>

<footer class="footer">
    <p>© 2026 Fumo Shop. A fan-made website dedicated to Touhou Project.</p>
</footer>

</body>
</html>
